openapi: 3.1.0
info:
  title: Servo Registration Control API
  version: 1.4.0
  description: >-
    mrbaron3/workflow#15 のloopback dashboardとPostgreSQL Registration駆動Control API。
    human-approved workflow-ciso05-dashboard-r02 /
    sha256:4f7357e099985d2dce5c1941b8ee25231e3208808727362b9f87d725084b70fa
    の7 capabilitiesをrevision-02 capability reconciliationへtraceする。
servers:
  - url: http://127.0.0.1:8080
security:
  - operatorBearer: []
  - browserSession: []
paths:
  /dashboard/bootstrap:
    get:
      security: []
      operationId: bootstrapBrowserSession
      x-designflow-capability: cap-establish-browser-control-session
      description: exact loopback Host/peerで一回限りtokenを消費し、HttpOnly sessionを設定してclean URLへ303。
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 512
      responses:
        "303":
          description: clean dashboard URLへredirect
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: exact Hostまたはloopback peer不一致
  /v1/browser-session:
    get:
      security:
        - browserSession: []
      operationId: getBrowserSession
      x-designflow-capability: cap-establish-browser-control-session
      responses:
        "200":
          description: expiryとmemory-only CSRF proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      security:
        - browserSession: []
      operationId: deleteBrowserSession
      x-designflow-capability: cap-establish-browser-control-session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: sessionとCSRF proofを失効
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Origin、fetch metadataまたはCSRF不一致
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: PostgreSQLへ接続でき、現在のcontrol processが応答可能
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/registrations:
    get:
      operationId: listRegistrationStatus
      x-designflow-capability: cap-list-registration-status
      x-freshness: >-
        componentごとにobservedAt、lastGoodAt、freshnessを返し、DB不達時はcacheを成功表示せず503。
      x-idempotency: read-only
      x-audit: 読取障害をstructured operational logへ記録し、個別read audit rowは作らない。
      parameters:
        - name: repository
          in: query
          description: 任意のcanonical owner/name filter
          schema:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?/[a-z0-9_.-]{1,100}$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: pageToken
          in: query
          schema:
            type: string
      responses:
        "200":
          description: anomaly-firstのdesired/actual status projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    post:
      operationId: createRegistration
      x-designflow-capability: cap-create-registration
      x-idempotency: Idempotency-Keyと正規化request hashをPostgreSQLへ同一transactionで保存。
      x-cancellation: 即時commandのため受付後cancel不可。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registrationを作成
          headers:
            ETag:
              $ref: "#/components/headers/RegistrationVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCommandResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/registrations/{registrationId}:
    patch:
      operationId: updateRegistration
      x-designflow-capability: cap-update-registration
      x-idempotency: >-
        success、not-found、version-conflict、no-changeを同じtransactionでrequest hash、
        structured outcome、recordedAt、auditへ保存する。同一key+requestは同じ結果を返し、
        keyを異なるfenceまたはpatchへ再利用すると409。
      x-freshness: If-Matchを現在versionへ照合し、stale commandを409で拒否。
      x-audit: actor、old/new version、結果をruntime_auditへtransactionalに保存。
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationPatch"
      responses:
        "200":
          description: 更新済みRegistration
          headers:
            ETag:
              $ref: "#/components/headers/RegistrationVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCommandResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/registrations/{registrationId}/disable:
    post:
      operationId: disableRegistration
      x-designflow-capability: cap-disable-registration
      x-idempotency: >-
        success、not-found、version-conflict、already-disabledを同じtransactionで保存し、
        rejected identityも再利用不能にする。
      x-cancellation: 即時commandのため受付後cancel不可。
      x-failure-semantics: version不一致、未知ID、DB不達を成功表示しない。
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: 無効化済みRegistration。未lease jobは同transactionでrejected。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCommandResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/deliveries/{deliveryId}:
    get:
      operationId: getDeliveryStatus
      x-designflow-capability: cap-inspect-delivery-status
      x-freshness: deliveryとretry attemptをPostgreSQL repeatable-read snapshotから返す。
      x-idempotency: read-only
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: deliveryとretry attemptの現在のdurable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/deliveries/{deliveryId}/retry:
    post:
      operationId: retryDelivery
      x-designflow-capability: cap-retry-delivery
      x-freshness: >-
        observedAttempts、delivery state、Registration enabled/executionEnabled/versionをrow lock下で再検証。
      x-idempotency: >-
        delivery間でglobalな同じIdempotency-Keyと同一requestは同じattemptId。
        deliveryを含む異requestへの再利用は409。
      x-retry: 通信失敗時は同じIdempotency-Keyで再送可能。
      x-cancellation: responseのcancellable=falseで取消不能を明示。
      x-audit: actor、delivery、attempt、observedAttempts、timeをtransactionalに保存。
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - observedAttempts
                - expectedRegistrationId
                - expectedRegistrationVersion
              properties:
                observedAttempts:
                  type: integer
                  minimum: 0
                expectedRegistrationId:
                  type: string
                  format: uuid
                expectedRegistrationVersion:
                  type: integer
                  minimum: 1
      responses:
        "202":
          description: retry attemptを重複なく受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryCommandResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/webhooks/github:
    post:
      security: []
      operationId: receiveGitHubWebhook
      x-persist-before-ack: signature/identity検証後にPostgreSQL commitが成功した場合だけ202。
      x-deduplication: X-GitHub-Deliveryはglobal unique。同key異payloadは409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: durable delivery receipt
        "401":
          description: X-Hub-Signature-256が不正
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
components:
  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
      description: 32..512 byte server-side operator credential; never exposed to browser code.
    browserSession:
      type: apiKey
      in: cookie
      name: agentops_session
  parameters:
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: quoted positive Registration version
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
  headers:
    RegistrationVersion:
      schema:
        type: string
      description: quoted current Registration version
  responses:
    Unauthorized:
      description: operator bearer authorizationが不正
    StoreUnavailable:
      description: >-
        PostgreSQL不達または未知schema。fail-closedで現在状態を返さず、status queryでは
        lastSuccessfulAtとbounded retry hintだけを返す。
    Conflict:
      description: >-
        stale version、disabled Registration、idempotency conflict、single-flight競合。
        delivery retry競合ではreason、current state、routeAttemptsを返す。
    NotFound:
      description: 指定resourceが存在しない
  schemas:
    RegistrationInput:
      type: object
      additionalProperties: false
      required:
        - repository
      properties:
        repository:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?/[a-z0-9_.-]{1,100}$"
        enabled:
          type: boolean
          default: true
        issueMonitorEnabled:
          type: boolean
          default: true
        prMonitorEnabled:
          type: boolean
          default: true
        executionEnabled:
          type: boolean
          default: true
        configuration:
          $ref: "#/components/schemas/RegistrationConfiguration"
    RegistrationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        issueMonitorEnabled:
          type: boolean
        prMonitorEnabled:
          type: boolean
        executionEnabled:
          type: boolean
        configuration:
          $ref: "#/components/schemas/RegistrationConfiguration"

    RegistrationConfiguration:
      type: object
      additionalProperties: false
      properties:
        mergeMethod:
          description: Registration-owned integration strategy; omission defaults to squash.
          enum: [squash, merge, rebase]
          default: squash
        releaseEvidence:
          $ref: "#/components/schemas/ReleaseEvidencePolicy"
        gateTimeoutSeconds:
          $ref: "#/components/schemas/RegistrationGateTimeoutSeconds"
    HistoricalRegistrationConfiguration:
      description: >-
        Decode-only response shape for persisted Registration versions. New
        create and patch commands remain restricted to RegistrationConfiguration.
      type: object
      additionalProperties: false
      properties:
        releaseEvidence:
          $ref: "#/components/schemas/HistoricalReleaseEvidencePolicy"
        gateTimeoutSeconds:
          $ref: "#/components/schemas/RegistrationGateTimeoutSeconds"
    RegistrationGateTimeoutSeconds:
      type: object
      description: Durable per-gate SLA in seconds; omitted keys use default, then 3600.
      additionalProperties: false
      properties:
        default: { type: integer, minimum: 60, maximum: 2592000 }
        planning: { type: integer, minimum: 60, maximum: 2592000 }
        design: { type: integer, minimum: 60, maximum: 2592000 }
        repository-graders: { type: integer, minimum: 60, maximum: 2592000 }
        review: { type: integer, minimum: 60, maximum: 2592000 }
        merge: { type: integer, minimum: 60, maximum: 2592000 }
        lease-recovery: { type: integer, minimum: 60, maximum: 2592000 }
    ReleaseEvidencePolicy:
      type: object
      additionalProperties: false
      required:
        - authority
        - requiredGateSignals
        - requiredReviewPerspectives
        - minimumHeadEpochs
      properties:
        authority:
          enum: [human-ready-allowed, ai-triage-required]
        requiredGateSignals:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [source, name]
                properties:
                  source:
                    enum: [repository-grader]
                  name:
                    enum:
                      - build
                      - typecheck
                      - unit_tests
                      - api_tests
                      - grader_profile
                      - secrets_scan
                      - scope_check
                      - playwright
              - type: object
                additionalProperties: false
                required: [source, name]
                properties:
                  source:
                    enum: [github-check]
                  name:
                    type: string
                    minLength: 1
                    maxLength: 128
        requiredReviewPerspectives:
          type: array
          minItems: 2
          maxItems: 7
          uniqueItems: true
          items:
            enum:
              - functionality
              - codeQuality
              - testQuality
              - ux
              - accessibility
              - security
              - type-design
        minimumHeadEpochs:
          type: integer
          minimum: 1
          maximum: 32
    HistoricalReleaseEvidencePolicy:
      description: >-
        Decode-only policy for immutable Registration versions whose
        repository-grader namespace and requirement-array uniqueness predated
        the canonical Stage 2 write contract.
      type: object
      additionalProperties: false
      required:
        - authority
        - requiredGateSignals
        - requiredReviewPerspectives
        - minimumHeadEpochs
      properties:
        authority:
          enum: [human-ready-allowed, ai-triage-required]
        requiredGateSignals:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [source, name]
            properties:
              source:
                enum: [repository-grader, github-check]
              name:
                type: string
                minLength: 1
                maxLength: 128
        requiredReviewPerspectives:
          type: array
          minItems: 2
          maxItems: 7
          items:
            enum:
              - functionality
              - codeQuality
              - testQuality
              - ux
              - accessibility
              - security
              - type-design
        minimumHeadEpochs:
          type: integer
          minimum: 1
          maximum: 32
    RegistrationPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextPageToken
        - observedAt
        - lastSuccessfulAt
        - mode
        - provenance
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationProjection"
        nextPageToken:
          type: string
        observedAt:
          type: string
          format: date-time
        lastSuccessfulAt:
          type: string
          format: date-time
        mode:
          $ref: "#/components/schemas/OperatingMode"
        provenance:
          $ref: "#/components/schemas/ReleaseProvenance"
    ReleaseProvenance:
      type: object
      additionalProperties: false
      required:
        - repository
        - revision
      properties:
        repository:
          type: [string, "null"]
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?/[a-z0-9_.-]{1,100}$"
        revision:
          type: [string, "null"]
          pattern: "^[0-9a-f]{40}$"
    RegistrationProjection:
      type: object
      additionalProperties: false
      required:
        - registration
        - mode
        - components
        - cursorObservedAt
        - lastPoll
        - lastDelivery
        - queueDepth
        - activeJobId
        - activeJobState
        - activeJobRegistrationVersion
        - lastJobFailure
        - recentDeliveryFailures
        - developmentProgress
      properties:
        registration:
          $ref: "#/components/schemas/Registration"
        mode:
          $ref: "#/components/schemas/OperatingMode"
        components:
          type: object
          additionalProperties: false
          required:
            - issue_monitor
            - pr_monitor
            - execution
            - queue
          properties:
            issue_monitor:
              $ref: "#/components/schemas/ComponentProjection"
            pr_monitor:
              $ref: "#/components/schemas/ComponentProjection"
            forwarder:
              $ref: "#/components/schemas/ComponentProjection"
            execution:
              $ref: "#/components/schemas/ComponentProjection"
            queue:
              $ref: "#/components/schemas/ComponentProjection"
        cursorObservedAt:
          type: object
          description: Durable monitor cursor advance time; not poll-attempt liveness.
          properties:
            issue:
              type:
                - string
                - "null"
              format: date-time
            pull_request:
              type:
                - string
                - "null"
              format: date-time
        lastPoll:
          type: object
          deprecated: true
          description: Deprecated v1.3 alias of cursorObservedAt; removed in the next API version.
          properties:
            issue:
              type:
                - string
                - "null"
              format: date-time
            pull_request:
              type:
                - string
                - "null"
              format: date-time
        lastDelivery:
          type:
            - string
            - "null"
          format: date-time
        queueDepth:
          type: integer
          minimum: 0
        activeJobId:
          type:
            - string
            - "null"
          format: uuid
        activeJobState:
          type:
            - string
            - "null"
          enum:
            - leased
            - queued
            - null
        activeJobRegistrationVersion:
          type:
            - integer
            - "null"
          minimum: 1
        lastJobFailure:
          oneOf:
            - $ref: "#/components/schemas/JobFailure"
            - type: "null"
        recentDeliveryFailures:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/DeliveryFailure"
        developmentProgress:
          type: array
          items:
            $ref: "#/components/schemas/DevelopmentIssueProgress"
    DevelopmentIssueProgress:
      type: object
      additionalProperties: false
      required:
        - repository
        - issueNumber
        - current
        - history
        - lastActivity
      properties:
        repository:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?/[a-z0-9_.-]{1,100}$"
        issueNumber:
          type: integer
          minimum: 1
        current:
          $ref: "#/components/schemas/DevelopmentProgressEvent"
        history:
          description: Newest-first events for this Issue coordinate, including current.
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/DevelopmentProgressEvent"
        lastActivity:
          description: Later of the durable event time and any active lease heartbeat.
          type: string
          format: date-time
    DevelopmentProgressEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - registrationId
        - registrationVersion
        - jobId
        - attemptId
        - attemptNumber
        - releaseId
        - repository
        - subjectKind
        - subjectNumber
        - parentIssueNumber
        - workerId
        - eventKey
        - phase
        - step
        - state
        - summary
        - nextGate
        - blocker
        - sessionName
        - worktreePath
        - branch
        - pullRequestNumber
        - occurredAt
        - jobStatus
        - jobLastError
        - leaseHeartbeatAt
      properties:
        id:
          type: integer
          minimum: 1
        registrationId:
          type: string
          format: uuid
        registrationVersion:
          type: integer
          minimum: 1
        jobId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
          minimum: 1
        releaseId:
          type: [string, "null"]
          format: uuid
        repository:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?/[a-z0-9_.-]{1,100}$"
        subjectKind:
          enum: [issue, pull_request, repository]
        subjectNumber:
          type: [integer, "null"]
          minimum: 1
        parentIssueNumber:
          description: Immutable body-linked parent Epic Issue, when present at ready time.
          type: [integer, "null"]
          minimum: 1
        workerId:
          type: string
          minLength: 1
        eventKey:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^[a-z0-9][a-z0-9:._/-]*$"
        phase:
          enum:
            - intake
            - planning
            - design
            - generation
            - validation
            - review
            - pull-request
            - merge
            - human-review
            - completed
            - failed
        step:
          type: string
          minLength: 1
          maxLength: 160
        state:
          enum: [pending, running, waiting, blocked, succeeded, failed]
        summary:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
        nextGate:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
        blocker:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
        sessionName:
          type: [string, "null"]
          minLength: 1
          maxLength: 250
        worktreePath:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
        branch:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
        pullRequestNumber:
          type: [integer, "null"]
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        jobStatus:
          enum: [queued, leased, succeeded, failed, cancelled, rejected]
        jobLastError:
          type: [string, "null"]
        leaseHeartbeatAt:
          type: [string, "null"]
          format: date-time
    OperatingMode:
      type: string
      enum:
        - OFF
        - MONITOR_ONLY
        - ACTIVE
        - DRAINING
    Registration:
      type: object
      additionalProperties: false
      required:
        - id
        - repository
        - enabled
        - issueMonitorEnabled
        - prMonitorEnabled
        - executionEnabled
        - configuration
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        repository:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,37}[a-z0-9])?/[a-z0-9_.-]{1,100}$"
        enabled:
          type: boolean
        issueMonitorEnabled:
          type: boolean
        prMonitorEnabled:
          type: boolean
        executionEnabled:
          type: boolean
        configuration:
          $ref: "#/components/schemas/HistoricalRegistrationConfiguration"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ComponentProjection:
      type: object
      additionalProperties: false
      required:
        - desired
        - actual
        - observedAt
        - freshness
        - staleReason
        - lastGoodAt
        - lastError
        - recoveryState
      properties:
        desired:
          type: boolean
        actual:
          enum:
            - unknown
            - starting
            - running
            - stopped
            - failed
            - idle
            - waiting
            - stale
            - disconnected
            - queued
            - leased
            - paused_by_mode
            - blocked_by_mode
        observedAt:
          type:
            - string
            - "null"
          format: date-time
        freshness:
          enum:
            - fresh
            - stale
            - unknown
        staleReason:
          type:
            - string
            - "null"
        lastGoodAt:
          type:
            - string
            - "null"
          format: date-time
